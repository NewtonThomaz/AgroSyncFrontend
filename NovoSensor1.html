<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Novo Sensor - AgroSync</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="tailwind-config.js"></script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-background font-sans antialiased min-h-screen flex flex-col">
    <!-- Top Navigation (Transactional/Back) -->
    <header
        class="w-full top-0 sticky bg-surface dark:bg-background border-b border-outline-variant dark:border-on-surface-variant z-50 flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16">
        <button onclick="history.back()"
            class="text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full active:scale-95 duration-150 flex items-center justify-center">
            <span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface">arrow_back</span>
        </button>
        <div class="flex items-center gap-4">
            <span
                class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">AgroSync</span>
        </div>
        <button onclick="window.location.reload()"
            class="flex items-center justify-center p-2 text-primary hover:scale-125 dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest rounded-full transition-colors duration-200">
            <span class="material-symbols-outlined">cloud_sync</span>
        </button>
    </header>


    <!-- Main Content Canvas -->
    <main class="flex-grow px-margin-mobile md:px-margin-desktop py-6 max-w-2xl mx-auto w-full">
        <div class="flex items-center gap-2 mb-8">
            <div class="flex-1 h-2 bg-primary rounded-full"></div>
            <div class="flex-1 h-2 bg-surface-container-highest rounded-full"></div>
            <div class="flex-1 h-2 bg-surface-container-highest rounded-full"></div>
        </div>

        <div class="mb-6">
            <h2
                class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">
                Selecione o tipo de sensor</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">Escolha a categoria do dispositivo IoT que você
                está instalando no campo para configurar a telemetria correta.</p>
        </div>
        <!-- Sensor Types List (Bento-inspired single column for mobile) -->
        <div class="flex flex-col gap-bento-gap">
            <!-- Ambient Sensor Card -->
            <button onclick="window.location.href='NovoSensor2.html'"
                class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-start text-left w-full hover:bg-surface-container-low active:bg-surface-container transition-colors shadow-sm relative group">
                <div
                    class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0 mr-4 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">thermostat</span>
                </div>
                <div class="flex-grow">
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-1">Temperatura</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant">Sensores de Temperatura. Essencial para
                        controle microclimático.</p>
                </div>
                <span class="material-symbols-outlined text-outline-variant self-center ml-2">chevron_right</span>
            </button>
            <!-- Soil Sensor Card -->
            <!-- EC Sensor Card -->
            <button onclick="window.location.href='NovoSensor2.html'"
                class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-start text-left w-full hover:bg-surface-container-low active:bg-surface-container transition-colors shadow-sm relative group">
                <div
                    class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0 mr-4 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
                </div>
                <div class="flex-grow">
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-1">Condutividade Elétrica</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant">Medidores de EC (Salinidade e
                        nutrientes). Fundamental para fertirrigação.</p>
                </div>
                <span class="material-symbols-outlined text-outline-variant self-center ml-2">chevron_right</span>
            </button>
            <!-- Irrigation Controller Card -->
            <button onclick="window.location.href='NovoSensor2.html'"
                class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-start text-left w-full hover:bg-surface-container-low active:bg-surface-container transition-colors shadow-sm relative group">
                <div
                    class="w-12 h-12 rounded-full bg-surface-tint text-on-primary flex items-center justify-center shrink-0 mr-4 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">water_drop</span>
                </div>
                <div class="flex-grow">
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-1">Umidade</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant"><span
                            style="background-color: rgb(255, 255, 255);">Sensores de Umidade. Essencial para controle
                            microclimático.</span></p>
                </div>
                <span class="material-symbols-outlined text-outline-variant self-center ml-2">chevron_right</span>
            </button>
        </div>
    </main>
    <!-- Bottom Nav & NavigationDrawer suppressed as this is a transactional flow -->
</body>

</html>
